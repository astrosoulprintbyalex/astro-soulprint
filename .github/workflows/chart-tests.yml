name: Human Design Chart tests
on:
  push:
    paths: ['soulprint-chart/**', '2027-lord-of-the-year/**', 'studio/sales/**', 'tests/**']
  pull_request:
    paths: ['soulprint-chart/**', '2027-lord-of-the-year/**', 'studio/sales/**', 'tests/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soulprint-chart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: soulprint-chart/package-lock.json
      - run: npm ci
      - run: npm test
      - name: 2027 Lord of the Year tests
        working-directory: .
        run: node --test tests/*.test.js
